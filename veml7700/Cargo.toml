[package]
name = "veml7700_api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.0.0-beta.7"
env_logger = "0.9.0"
linux-embedded-hal = "0.4"
embedded-hal = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[[bin]]
name = "veml7700_api"
path = "src/main.rs"

[target.arm-unknown-linux-musleabihf]
