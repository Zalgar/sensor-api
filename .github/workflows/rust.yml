name: Sensor API Build and Release

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed-sensors: ${{ steps.changes.outputs.changed-sensors }}
      any-changes: ${{ steps.changes.outputs.any-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed sensors
        id: changes
        run: |
          # Install jq if not available
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          else
            # For push events, compare with previous commit
            if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
            else
              # First commit, check all files
              CHANGED_FILES=$(git ls-files)
            fi
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Define all sensors
          ALL_SENSORS=("bme280" "pmsa003i" "scd-41" "ltr390" "bh1750" "veml7700" "tsl2591" "sensor-collector")
          
          # Detect which sensors have changes
          CHANGED_SENSORS=()
          for sensor in "${ALL_SENSORS[@]}"; do
            if echo "$CHANGED_FILES" | grep -q "^${sensor}/"; then
              CHANGED_SENSORS+=("$sensor")
              echo "Detected changes in: $sensor"
            fi
          done
          
          # Check for sensors without existing releases (only on main branch)
          SENSORS_WITHOUT_RELEASES=()
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "Checking for sensors without releases..."
            
            # First, get all releases from the repository
            echo "Fetching repository releases..."
            RELEASES_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases")
            
            # Check if API call was successful
            if [ $? -ne 0 ]; then
              echo "❌ GitHub API call failed, will build all sensors as fallback"
              SENSORS_WITHOUT_RELEASES=("${ALL_SENSORS[@]}")
            else
              echo "✅ Successfully fetched releases data"
              echo "Raw API response (first 500 chars):"
              echo "$RELEASES_RESPONSE" | head -c 500
              echo ""
              
              # Extract all release tag names
              EXISTING_TAGS=$(echo "$RELEASES_RESPONSE" | jq -r '.[].tag_name' 2>/dev/null || echo "")
              
              if [ -z "$EXISTING_TAGS" ]; then
                echo "No existing releases found or jq failed - will build all sensors"
                SENSORS_WITHOUT_RELEASES=("${ALL_SENSORS[@]}")
              else
                echo "Existing release tags:"
                echo "$EXISTING_TAGS"
                echo ""
                
                # Check each sensor for existing releases
                for sensor in "${ALL_SENSORS[@]}"; do
                  SENSOR_RELEASES=$(echo "$EXISTING_TAGS" | grep "^${sensor}-" | wc -l)
                  
                  if [ "$SENSOR_RELEASES" -eq 0 ]; then
                    SENSORS_WITHOUT_RELEASES+=("$sensor")
                    echo "No releases found for: $sensor"
                  else
                    echo "Found $SENSOR_RELEASES existing release(s) for: $sensor"
                  fi
                done
              fi
            fi
          else
            echo "Skipping release check (not on main branch)"
          fi
          
          # Combine changed sensors and sensors without releases
          BUILD_SENSORS=()
          
          # Add changed sensors
          for sensor in "${CHANGED_SENSORS[@]}"; do
            BUILD_SENSORS+=("$sensor")
          done
          
          # Add sensors without releases (avoid duplicates)
          for sensor in "${SENSORS_WITHOUT_RELEASES[@]}"; do
            if [[ ! " ${BUILD_SENSORS[@]} " =~ " ${sensor} " ]]; then
              BUILD_SENSORS+=("$sensor")
              echo "Adding sensor without release: $sensor"
            fi
          done
          
          # Debug output
          echo "=== BUILD DECISION SUMMARY ==="
          echo "Changed sensors: ${CHANGED_SENSORS[*]:-none}"
          echo "Sensors without releases: ${SENSORS_WITHOUT_RELEASES[*]:-none}"
          echo "Total sensors to build: ${BUILD_SENSORS[*]:-none}"
          echo "=============================="
          
          # Convert array to JSON format for matrix
          if [ ${#BUILD_SENSORS[@]} -eq 0 ]; then
            echo "changed-sensors=[]" >> $GITHUB_OUTPUT
            echo "any-changes=false" >> $GITHUB_OUTPUT
            echo "❌ No sensors to build"
          else
            # Create JSON array manually to avoid jq dependency issues
            JSON_ARRAY="["
            for i in "${!BUILD_SENSORS[@]}"; do
              if [ $i -gt 0 ]; then
                JSON_ARRAY+=","
              fi
              JSON_ARRAY+="\"${BUILD_SENSORS[$i]}\""
            done
            JSON_ARRAY+="]"
            
            echo "changed-sensors=$JSON_ARRAY" >> $GITHUB_OUTPUT
            echo "any-changes=true" >> $GITHUB_OUTPUT
            echo "✅ Sensors to build: ${BUILD_SENSORS[*]}"
            echo "✅ JSON output: $JSON_ARRAY"
            
            # Output summary
            if [ ${#CHANGED_SENSORS[@]} -gt 0 ]; then
              echo "📝 Changed sensors: ${CHANGED_SENSORS[*]}"
            fi
            if [ ${#SENSORS_WITHOUT_RELEASES[@]} -gt 0 ]; then
              echo "🚀 Sensors without releases: ${SENSORS_WITHOUT_RELEASES[*]}"
            fi
          fi

  build-and-release:
    needs: detect-changes
    if: needs.detect-changes.outputs.any-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sensor: ${{ fromJson(needs.detect-changes.outputs.changed-sensors) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: arm-unknown-linux-musleabihf

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-arm-linux-gnueabihf pkg-config libssl-dev

      - name: Generate version timestamp
        id: version
        run: |
          VERSION=$(date -u +"%Y.%m.%d-%H.%M")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Build ${{ matrix.sensor }} for ARM Linux
        run: |
          cd ${{ matrix.sensor }}
          echo "Building ${{ matrix.sensor }} version ${{ steps.version.outputs.version }}"
          cargo build --target arm-unknown-linux-musleabihf --release --verbose

      - name: Verify build artifacts
        id: verify
        run: |
          cd ${{ matrix.sensor }}
          
          # Determine expected binary name based on sensor type
          if [ "${{ matrix.sensor }}" == "sensor-collector" ]; then
            EXPECTED_BINARY="sensor-collector"
          elif [ "${{ matrix.sensor }}" == "scd-41" ]; then
            EXPECTED_BINARY="scd-41_api"
          else
            EXPECTED_BINARY="${{ matrix.sensor }}_api"
          fi
          
          BINARY_PATH="target/arm-unknown-linux-musleabihf/release/$EXPECTED_BINARY"
          
          if [ -f "$BINARY_PATH" ]; then
            echo "✅ Binary built successfully: $EXPECTED_BINARY"
            ls -la "$BINARY_PATH"
            echo "binary-name=$EXPECTED_BINARY" >> $GITHUB_OUTPUT
            echo "binary-path=$BINARY_PATH" >> $GITHUB_OUTPUT
          else
            echo "❌ Expected binary not found: $BINARY_PATH"
            echo "Contents of release directory:"
            ls -la target/arm-unknown-linux-musleabihf/release/
            exit 1
          fi

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          cd ${{ matrix.sensor }}
          
          # Copy binary using the verified binary name
          BINARY_NAME="${{ steps.verify.outputs.binary-name }}"
          cp "${{ steps.verify.outputs.binary-path }}" "../release-artifacts/$BINARY_NAME"
          
          # Copy configuration files if they exist
          if [ -f "config.json" ]; then
            cp config.json ../release-artifacts/config.json.example
          fi
          
          # Copy systemd service file
          if [ -f "../systemd/${{ matrix.sensor }}.service" ]; then
            cp "../systemd/${{ matrix.sensor }}.service" ../release-artifacts/
          fi
          
          # Create README for this release
          cat > ../release-artifacts/README.md << EOF
          # ${{ matrix.sensor }} Release ${{ steps.version.outputs.version }}
          
          ## Installation
          
          1. Copy the binary to your target system:
             \`\`\`bash
             sudo mkdir -p /srv/${{ matrix.sensor }}
             sudo cp ${BINARY_NAME} /srv/${{ matrix.sensor }}/
             sudo chmod +x /srv/${{ matrix.sensor }}/${BINARY_NAME}
             sudo chown -R sensor:sensor /srv/${{ matrix.sensor }}
             \`\`\`
          
          2. Install systemd service (if provided):
             \`\`\`bash
             sudo cp ${{ matrix.sensor }}.service /etc/systemd/system/
             sudo systemctl daemon-reload
             sudo systemctl enable ${{ matrix.sensor }}.service
             sudo systemctl start ${{ matrix.sensor }}.service
             \`\`\`
          
          3. Configure as needed using config.json.example as a template.
          
          ## Build Information
          - **Built on**: $(date -u)
          - **Target**: arm-unknown-linux-musleabihf
          - **Rust version**: $(rustc --version)
          - **Commit**: ${{ github.sha }}
          - **Binary**: ${BINARY_NAME}
          EOF

      - name: Create compressed archive
        run: |
          cd release-artifacts
          tar -czf ${{ matrix.sensor }}-${{ steps.version.outputs.version }}-arm-linux.tar.gz *
          echo "Created archive: ${{ matrix.sensor }}-${{ steps.version.outputs.version }}-arm-linux.tar.gz"
          ls -la *.tar.gz

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ matrix.sensor }}-${{ steps.version.outputs.version }}
          name: ${{ matrix.sensor }} ${{ steps.version.outputs.version }}
          body: |
            ## ${{ matrix.sensor }} Release ${{ steps.version.outputs.version }}
            
            **Build Information:**
            - 🎯 Target: `arm-unknown-linux-musleabihf`
            - 🔨 Built from commit: `${{ github.sha }}`
            - 📅 Build time: `${{ steps.version.outputs.version }}`
            - 🚀 Trigger: Automatic build (code changes or first release)
            
            **Build Reason:**
            This sensor was built because either:
            - Code changes were detected in the sensor directory, OR
            - No previous release exists for this sensor
            
            **What's included:**
            - Compiled binary for ARM Linux
            - SystemD service file (if applicable)
            - Example configuration file
            - Installation instructions
            
            **Installation:**
            1. Download and extract the archive
            2. Copy binary to `/srv/${{ matrix.sensor }}/`
            3. Install systemd service
            4. Configure and start the service
            
            See the included README.md for detailed installation instructions.
          files: |
            release-artifacts/${{ matrix.sensor }}-${{ steps.version.outputs.version }}-arm-linux.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update Latest Tag
        if: github.ref == 'refs/heads/main'
        run: |
          # Set up git configuration
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Define the latest tag name
          LATEST_TAG="${{ matrix.sensor }}-latest"
          
          echo "Creating/updating latest tag: $LATEST_TAG"
          
          # Check if the latest tag already exists
          if git rev-parse --verify "$LATEST_TAG" >/dev/null 2>&1; then
            echo "Latest tag $LATEST_TAG exists, deleting old tag"
            # Delete the tag locally and remotely
            git tag -d "$LATEST_TAG" || true
            git push origin --delete "$LATEST_TAG" || true
          else
            echo "Latest tag $LATEST_TAG does not exist, will create new one"
          fi
          
          # Create the new latest tag pointing to current commit
          git tag -a "$LATEST_TAG" -m "Latest release of ${{ matrix.sensor }} (auto-updated to ${{ steps.version.outputs.version }})"
          
          # Push the new latest tag
          git push origin "$LATEST_TAG"
          
          echo "✅ Successfully created/updated latest tag: $LATEST_TAG"
          echo "🏷️  Latest tag now points to: ${{ matrix.sensor }}-${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Latest Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ matrix.sensor }}-latest
          name: ${{ matrix.sensor }} (Latest)
          body: |
            # ${{ matrix.sensor }} - Latest Release
            
            **This is an auto-updating tag that always points to the most recent release.**
            
            **Current Version:** `${{ steps.version.outputs.version }}`
            
            ---
            
            ## ${{ matrix.sensor }} Release ${{ steps.version.outputs.version }}
            
            **Build Information:**
            - 🎯 Target: `arm-unknown-linux-musleabihf`
            - 🔨 Built from commit: `${{ github.sha }}`
            - 📅 Build time: `${{ steps.version.outputs.version }}`
            - 🚀 Trigger: Automatic build (code changes or first release)
            
            **Build Reason:**
            This sensor was built because either:
            - Code changes were detected in the sensor directory, OR
            - No previous release exists for this sensor
            
            **What's included:**
            - Compiled binary for ARM Linux
            - SystemD service file (if applicable)
            - Example configuration file
            - Installation instructions
            
            **Installation:**
            1. Download and extract the archive
            2. Copy binary to `/srv/${{ matrix.sensor }}/`
            3. Install systemd service
            4. Configure and start the service
            
            **Note:** This "latest" release is automatically updated whenever a new version is built. For stable deployments, consider using a specific version tag like `${{ matrix.sensor }}-${{ steps.version.outputs.version }}` instead.
            
            See the included README.md for detailed installation instructions.
          files: |
            release-artifacts/${{ matrix.sensor }}-${{ steps.version.outputs.version }}-arm-linux.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "## Build Summary for ${{ matrix.sensor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: arm-unknown-linux-musleabihf" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "- **Release**: Created release ${{ matrix.sensor }}-${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Latest Tag**: Updated ${{ matrix.sensor }}-latest to point to this release" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Release**: Skipped (not main branch)" >> $GITHUB_STEP_SUMMARY
          fi

  build-summary:
    needs: [detect-changes, build-and-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build Summary
        run: |
          echo "# Sensor API Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-changes.outputs.any-changes }}" == "true" ]; then
            echo "## Sensors Built" >> $GITHUB_STEP_SUMMARY
            echo "The following sensors were built:" >> $GITHUB_STEP_SUMMARY
            echo '${{ needs.detect-changes.outputs.changed-sensors }}' | jq -r '.[] | "- " + .' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Build reasons:**" >> $GITHUB_STEP_SUMMARY
            echo "- Sensors with code changes are automatically built" >> $GITHUB_STEP_SUMMARY
            echo "- Sensors without existing releases are built on main branch" >> $GITHUB_STEP_SUMMARY
          else
            echo "## No Builds Required" >> $GITHUB_STEP_SUMMARY
            echo "No sensor code was modified and all sensors have existing releases." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build-and-release.result }}" == "success" ]; then
            echo "✅ All builds completed successfully" >> $GITHUB_STEP_SUMMARY
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then
              echo "🚀 Releases created for built sensors" >> $GITHUB_STEP_SUMMARY
              echo "🏷️  Latest tags updated for all built sensors" >> $GITHUB_STEP_SUMMARY
            else
              echo "📝 Development build (no releases created)" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ needs.build-and-release.result }}" == "failure" ]; then
            echo "❌ Some builds failed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build-and-release.result }}" == "skipped" ]; then
            echo "⏭️ Builds skipped (no changes and all sensors have releases)" >> $GITHUB_STEP_SUMMARY
          fi