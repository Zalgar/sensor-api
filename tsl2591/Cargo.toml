[package]
name = "tsl2591_api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tsl2591_api"
path = "src/main.rs"

[dependencies]
actix-web = "4.0.0-beta.7"
linux-embedded-hal = "0.4"
embedded-hal = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
log = "0.4"